name: deploy
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: coastaldigital
    steps:
      - name: Update working copy
        run: |
          cd /opt/cdr-home
          git fetch origin
          git reset --hard origin/master
          git rev-parse --short HEAD

      - name: Build container
        run: |
          cd /opt/cdr-home
          sudo /usr/bin/podman build -t cdr-home:latest -f Containerfile .

      - name: Restart service
        run: |
          sudo /bin/systemctl restart cdr-home.service
          sleep 3
          sudo /bin/systemctl status cdr-home.service --no-pager | head -10

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/.well-known/agent.json || echo 000)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "health check failed" >&2
          exit 1
